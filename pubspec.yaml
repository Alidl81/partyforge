name: partyforge
description: Deterministic offline and LAN party games for Android and Windows.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  drift: ^2.34.3
  flame: ^1.38.0
  flame_audio: ^2.12.2
  flutter_riverpod: ^3.4.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.5.0
  uuid: ^4.5.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.6.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/dictionaries/fa_words.txt
    - assets/game_art/chrono_lock.png
    - assets/game_art/hidden_fuse.png
    - assets/game_art/signal_snap.png
    - assets/game_art/ghost_trace.png
    - assets/game_art/word_forge.png
    - assets/game_art/shadow_path.png
    - assets/game_art/sketch_imposter.png
    - assets/game_art/split_control.png
    - assets/game_art/memory_grid.png
    - assets/game_art/color_clash.png
    - assets/game_art/number_rush.png
    - assets/game_art/tap_storm.png
