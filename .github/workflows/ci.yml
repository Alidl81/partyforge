name: CI

on:
  push:
  pull_request:

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate Android wrapper
        run: |
          flutter create --platforms=android --org com.partyforge --project-name partyforge .
          rm -f test/widget_test.dart
      - name: Apply Android LAN configuration
        run: |
          cp platform_overrides/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp platform_overrides/android/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format lib test integration_test tool
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: partyforge-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Generate Windows wrapper
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.partyforge --project-name partyforge .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: partyforge-windows
          path: build/windows/x64/runner/Release/**
